repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-data-files
        name: block data files
        language: fail
        entry: Data files must not be committed
        files: '\.(csv|tsv|xlsx|xls|xlsm|parquet|feather|sav|dta|db|sqlite|sqlite3|pkl|pickle)$'
