[project]
name = "auto-balls"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas",
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "nbstripout",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
