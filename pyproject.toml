[project]
name = "obs015-vlan-parser"
version = "0.1.0"
description = "Turn multi-switch 'show int status' / 'show mac address-table' captures into an Excel VLAN-per-port report"
requires-python = ">=3.11,<3.15"
dependencies = [
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "nbstripout",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
